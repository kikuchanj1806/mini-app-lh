<div class="nl-page">
  <div class="nl-tabs">
    <button
      type="button"
      [class.active]="selectedCategoryId === null"
      (click)="onCategoryTap(null)"
    >
      Tất cả
    </button>
    @for (cat of categories; track cat.id) {
      <button
        type="button"
        [class.active]="selectedCategoryId === cat.id"
        (click)="onCategoryTap(cat.id)"
      >
        {{ cat.name }}
      </button>
    }
  </div>

  <div class="nl-list">
    @if (items && items.length) {
      @for (it of items; track it.id) {
        <article class="nl-item" [routerLink]="'/newdetail'" [queryParams]="{ id: it.id }">
          <h2 class="nl-title">{{ it.title }}</h2>

          <div class="nl-img">
            <img
              [src]="imgSrc(it)"
              alt="news"
              loading="lazy"
              (error)="fallbackImg($event)"
            />
          </div>

          <div class="nl-meta">
            <div class="nl-date">
              <i class="fa-regular fa-calendar"></i>
              <span>{{ it.publishedMs ? (it.publishedMs | date:'dd/MM/yyyy') : '' }}</span>
            </div>

            <button type="button" class="nl-like" (click)="toggleLike(it, $event)">
              <span>Quan tâm</span>
              <i class="fa-regular"
                 [class.fa-bookmark]="!it.liked"
                 [class.fa-bookmark-solid]="it.liked"></i>
            </button>
          </div>
        </article>

        <div class="nl-divider"></div>
      }
    } @else {
      <div class="nl-empty">Chưa có dữ liệu</div>
    }
  </div>
</div>
