<div class="td-page">
  <div class="container td-container py-3">

    <!-- CARD: Ticket info -->
    <div class="card shadow td-card rounded-4 mb-3">
      <div class="card-body p-3">

        <div class="text-center text-muted mb-2">Số thứ tự của bạn</div>
        <div class="text-center td-number fw-bold mb-4">{{ ticketNo }}</div>

        <!-- Row 1 -->
        <div class="d-flex gap-3 px-3 py-2 rounded-4 align-items-center td-soft-primary mb-3">
          <div class="td-ico td-ico-primary flex-shrink-0">
            <i class="fa-light fa-qrcode"></i>
          </div>
          <div class="flex-grow-1">
            <div class="fw-bold">{{ fieldIndex }}. {{ fieldName }}</div>
            <div class="text-muted small">Lĩnh vực</div>
          </div>
        </div>

        <!-- Row 2 -->
        <div class="d-flex gap-3 px-3 py-2 rounded-4 align-items-center td-soft-success mb-3">
          <div class="td-ico td-ico-success flex-shrink-0">
            <i class="fas fa-clock"></i>
          </div>
          <div class="flex-grow-1">
            <div class="fw-bold">{{ timeRange }}</div>
            <div class="text-muted small">Thời gian hẹn</div>

            <div class="d-inline-flex align-items-center gap-2 px-2 py-1 rounded-pill td-pill-warn mt-2">
              <span class="td-dot"></span>
              <span class="fw-semibold">{{ statusText }}</span>
            </div>
          </div>
        </div>

        <!-- Row 3 -->
        <div class="d-flex gap-3 px-3 py-2 rounded-4 align-items-center td-soft-purple">
          <div class="td-ico td-ico-purple flex-shrink-0">
            <i class="fas fa-eye"></i>
          </div>
          <div class="flex-grow-1">
            <div class="fw-bold">{{ createdAt }}</div>
            <div class="text-muted small">Ngày tạo</div>
          </div>
        </div>

      </div>
    </div>
