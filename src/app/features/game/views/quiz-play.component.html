<div class="qp-page" *ngIf="current as q">
  <!-- Header info -->
  <div class="qp-top">
    <div class="qp-progress">
      <div class="qp-progress__text">
        Câu {{ index + 1 }}/{{ total }} • Đã làm {{ answeredCount }}/{{ total }}
      </div>
      <div class="qp-progress__bar">
        <div
          class="qp-progress__barFill"
          [style.width.%]="total ? (answeredCount * 100) / total : 0"
        ></div>
      </div>
    </div>

<!--    <div class="qp-timer">-->
<!--      <i class="fa-regular fa-clock"></i>-->
<!--      <span>{{ formatTime(elapsedSeconds) }}</span>-->
<!--    </div>-->
  </div>

  <!-- Question -->
  <div class="qp-card">
    <div class="qp-q">
      <div class="qp-q__no">Câu {{ index + 1 }}</div>
      <div class="qp-q__content">{{ q.content }}</div>
    </div>

    <!-- Options -->
    <div class="qp-opts">
      <button
        type="button"
        class="qp-opt"
        [class.is-selected]="selected(q.id) === 'A'"
        (click)="choose('A')"
      >
        <span class="qp-opt__k">A</span>
        <span class="qp-opt__t">{{ q.options.A }}</span>
      </button>

      <button
        type="button"
        class="qp-opt"
        [class.is-selected]="selected(q.id) === 'B'"
        (click)="choose('B')"
      >
        <span class="qp-opt__k">B</span>
        <span class="qp-opt__t">{{ q.options.B }}</span>
      </button>

      <button
        type="button"
        class="qp-opt"
        [class.is-selected]="selected(q.id) === 'C'"
        (click)="choose('C')"
      >
        <span class="qp-opt__k">C</span>
        <span class="qp-opt__t">{{ q.options.C }}</span>
      </button>

      <button
        type="button"
        class="qp-opt"
        [class.is-selected]="selected(q.id) === 'D'"
        (click)="choose('D')"
      >
        <span class="qp-opt__k">D</span>
        <span class="qp-opt__t">{{ q.options.D }}</span>
      </button>
    </div>
  </div>

  <!-- Nav buttons -->
  <div class="qp-nav">
    <button type="button" class="qp-btn qp-btn--ghost" [disabled]="!canPrev" (click)="prev()">
      <i class="fa-regular fa-chevron-left"></i>
      <span>Trước</span>
    </button>

    <button type="button" class="qp-btn qp-btn--ghost" [disabled]="!canNext" (click)="next()">
      <span>Sau</span>
      <i class="fa-regular fa-chevron-right"></i>
    </button>
  </div>

  <!-- Quick jump (optional) -->
  <div class="qp-dots">
    <button
      type="button"
      class="qp-dot"
      *ngFor="let _ of questions; let i = index"
      [class.is-active]="i === index"
      [class.is-done]="selected(questions[i].id) !== null"
      (click)="jumpTo(i)"
    ></button>
  </div>

  <!-- Submit -->
  <div class="qp-submit">
    <button
      type="button"
      class="qp-btn qp-btn--primary"
      [disabled]="!canSubmit"
      (click)="submit()"
    >
      <span>Nộp bài</span>
      <i class="fa-regular fa-paper-plane"></i>
    </button>

    <small class="qp-hint" *ngIf="!canSubmit">
      Vui lòng trả lời đủ {{ total }} câu để nộp bài.
    </small>
  </div>
</div>
