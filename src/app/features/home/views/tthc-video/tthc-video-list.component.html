<div class="page">
  @if (loading) {
    <div class="loading">Đang tải...</div>
  }

  @if (!loading && (!items || items.length === 0)) {
    <div class="empty">Chưa có video hướng dẫn.</div>
  }

  @if (items && items.length) {
    <div class="list">
      @for (it of items; track trackById($index, it)) {
        <button type="button" class="card" (click)="onOpen(it)">
          <div class="thumb">
            <img [src]="imgSrc(it)" (error)="fallbackImg($event)" alt="thumb" />
          </div>

          <div class="content">
            <div class="title">{{ it.title }}</div>
            <div class="subtitle">{{ it.subtitle }}</div>
          </div>
        </button>
      }
    </div>
  }
</div>
